<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>

  <link rel="stylesheet" href="../style.css">

  <title>Codebase Meta Analysis</title>
</head>

<body>
  <h1>Codebase Meta Analysis</h1>
  <p>Statistics and visualizations of my portfolio's Git history.</p>

  <h2>Summary Statistics</h2>
  <div id="stats"></div>

  <h2>Commits by Time of Day</h2>
  <div id="chart"></div>

  <p id="selection-count">No commits selected</p>

  <h2>Selected Commit Languages</h2>
  <dl id="language-breakdown" class="stats"></dl>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
      <a id="commit-link" href="" target="_blank" rel="noopener noreferrer"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>
</body>
</html>
